<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matesx Media Gallery</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-top: 0; margin-bottom: 30px; font-weight: 300; }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1600px;
        }

        .media-item {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            background-color: var(--card-bg);
            transition: transform 0.3s ease;
        }

        .media-item:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <h1>Matesx Media Gallery</h1>
    <div id="gallery"></div>

    <script>
        const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
        const videoExtensions = ['mp4', 'webm', 'ogg', 'mov'];

        // Fetches the JSON list generated by GitHub Actions
        fetch('files.json')
            .then(response => response.json())
            .then(files => {
                const gallery = document.getElementById('gallery');
                
                files.forEach(file => {
                    const ext = file.split('.').pop().toLowerCase();
                    const filePath = `media/${file}`;

                    if (imageExtensions.includes(ext)) {
                        const img = document.createElement('img');
                        img.src = filePath;
                        img.className = 'media-item';
                        img.loading = 'lazy';
                        gallery.appendChild(img);
                    } else if (videoExtensions.includes(ext)) {
                        const video = document.createElement('video');
                        video.src = filePath;
                        video.className = 'media-item';
                        video.autoplay = true;
                        video.loop = true;
                        video.muted = true; 
                        video.playsInline = true;
                        gallery.appendChild(video);
                    }
                });
            })
            .catch(error => console.error('Error loading files.json:', error));
    </script>
</body>
</html>
