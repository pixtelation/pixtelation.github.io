name: Update Matesx Gallery

on:
  push:
    paths:
      - 'matesx/media/**'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate files.json
        run: |
          cd matesx
          python -c "import os, json; print(json.dumps([f for f in os.listdir('media') if os.path.isfile(os.path.join('media', f)) and not f.startswith('.')]) if os.path.exists('media') else '[]')" > files.json

      - name: Commit and Push files.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matesx/files.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matesx files.json [skip ci]" && git push)